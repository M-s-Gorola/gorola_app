packages:
  - apps/api
  - apps/web
  - packages/shared
  - packages/ui

overrides:
  # Overridden due to moderate security vulnerability in <=10.1.0
  ip-address: "^10.1.1"

  # Overridden due to moderate security vulnerabilities (JWT scheme bypass, HTML injection, percent-encoded path routing) in <4.12.21, and high vulnerability (CORS reflecting wildcard origin with credentials) in <4.12.25
  hono: "^4.12.27"

  # Overridden due to high security vulnerabilities (host confusion via literal backslash authority delimiter & IDN canonicalization, GHSA-v2hh-gcrm-f6hx, GHSA-4c8g-83qw-93j6) — requires >=3.1.4
  fast-uri: "^3.1.4"

  # Overridden due to high security vulnerability (DoS/Process crash) in <0.217.0
  "@opentelemetry/sdk-node": "^0.217.0"

  # Overridden due to high security vulnerability (DoS/Process crash) in <0.217.0
  "@opentelemetry/exporter-prometheus": "^0.217.0"

  # Overridden due to high security vulnerability (DoS via unhandled exception on malformed header in JaegerPropagator, GHSA-45rx-2jwx-cxfr) — requires >=2.9.0
  "@opentelemetry/propagator-jaeger": "^2.9.0"

  # Overridden due to moderate security vulnerability (unbounded memory allocation in W3C Baggage propagation) in <2.8.0
  "@opentelemetry/core": "^2.8.0"

  # Overridden due to high security vulnerabilities (DoS/recursion in <=7.5.5, DoS unbounded Any expansion in <=7.6.0) — requires >=7.6.1
  protobufjs: "^7.6.1"

  # Overridden due to moderate security vulnerability (overlong UTF-8) in <=1.1.0
  "@protobufjs/utf8": "^1.1.1"

  # Overridden due to high security vulnerabilities (DoS via exponential-time expansion & unbounded expansion length, GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg) — requires >=1.1.16 for v1 and >=5.0.8 for v5
  "minimatch@3>brace-expansion": "^1.1.16"
  "minimatch@10>brace-expansion": "^5.0.8"

  # Overridden due to high security vulnerability (memory exhaustion DoS from tiny fragments) in <8.21.0
  ws: "^8.21.0"

  # Overridden due to moderate security vulnerability (remotely triggerable DoS) in <=6.15.2
  qs: "^6.15.2"

  # Overridden due to high security vulnerabilities (NO_PROXY bypass CVE-2025-62718, MitM via prototype pollution) in <1.16.0
  axios: "^1.16.0"

  # Overridden due to critical security vulnerability (arbitrary file read/execution in Vitest UI server) in <4.1.0
  vitest: "^4.1.0"

  # Overridden to ensure single Zod version across workspace and resolve react-hook-form type mismatches in hoisted linker mode
  zod: "^4.3.6"

  # Overridden to ^7.18.1 to resolve all React Router XSS, RCE, and DoS security advisories
  react-router: "^7.18.1"
  react-router-dom: "^7.18.1"

  # Overridden to ^3.0.0 due to high security vulnerability (DoS via reflected user input in single-fetch, GHSA-rxv8-25v2-qmq8) — requires >=3.0.0
  turbo-stream: "^3.0.0"

  # Overridden due to high security vulnerability (DDoS with HTTP2 in find-my-way, GHSA-c96f-x56v-gq3h) — requires >=9.7.0
  find-my-way: "^9.7.0"

  # Overridden due to high security vulnerability (Path Traversal in sourceMappingURL leading to arbitrary .map file disclosure, GHSA-r28c-9q8g-f849) — requires >=8.5.18
  postcss: "^8.5.18"

  # Overridden due to high security vulnerabilities (Prototype Pollution, ReDoS) in <0.20.2
  xlsx: "https://cdn.sheetjs.com/xlsx-latest/xlsx-latest.tgz"

  # Overridden due to high security vulnerabilities (server crash, malformed compression message crash) in <1.14.4
  "@grpc/grpc-js": "^1.14.4"

  # Overridden due to high security vulnerability (remote code execution via NPM_CONFIG_REGISTRY in Deno module) in <0.28.1
  esbuild: "^0.28.1"

  # Overridden due to high security vulnerability (CRLF injection via unescaped multipart field names/filenames, GHSA-hmw2-7cc7-3qxx) in <4.0.6
  form-data: "^4.0.6"

  # Overridden due to high security vulnerability (YAML merge-key chains forcing quadratic CPU consumption, GHSA-52cp-r559-cp3m) — requires >=4.3.0
  js-yaml: "^4.3.0"

  # Overridden due to low security vulnerability (arbitrary file read via sourceMappingURL comment, GHSA-4x5r-pxfx-6jf8) in <=7.29.0
  "@babel/core": "^7.29.6"

  # Overridden due to high security vulnerability (Zero-attachment Memory Exhaustion in Socket.IO, GHSA-2m8v-j782-fhvr)
  socket.io: "^4.8.1"
  engine.io: "^6.6.2"

  # Overridden due to high security vulnerability (cross-user information disclosure in undici, GHSA-4cwx-7wf7-3272)
  undici: "^6.21.1"

  # Overridden due to high security vulnerability (infinite loop in custom generator, GHSA-2v37-7h3g-55p8)
  nanoid: "^3.3.8"

  # Overridden due to high security vulnerability (stack exhaustion on recursive graphs, GHSA-ggr8-5vv4-36mx)
  deepmerge-ts: "^7.1.5"

  # Overridden due to high security vulnerabilities (unbounded memory growth & prototype write in browserslist, GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g)
  browserslist: "^4.24.4"
